syntax = "proto3";

package controlplane;

// needed to create proto
option go_package = "./proto";

// controlplane service definition
service ControlPlane {
  // service registration (serviceName -> url mapping)
  rpc RegisterService (RegisterRequest) returns (RegisterResponse);

  // Given a serviceName, returns a target route url
  rpc GetRouting (RouteRequest) returns (RouteResponse);
}

// Field numbers (1, 2, 3) are used for efficient serialization and backward compatibility.
message RegisterRequest {
  string service_name = 1;
  string address = 2;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message RouteRequest {
  string service_name = 1;
}

message RouteResponse {
  bool success = 1;
  string address = 2;
}